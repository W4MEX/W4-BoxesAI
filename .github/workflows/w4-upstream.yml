name: Propose Activepieces core update
on:
  schedule:
    - cron: '23 9 * * 2,5'
  workflow_dispatch:

permissions: {}

concurrency:
  group: activepieces-upstream-proposal
  cancel-in-progress: false

jobs:
  propose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Prepare review branch and draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/w4/automation/propose.sh
