name: W4 Verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: W4 verification
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Source and updater checks
        run: |
          python3 deploy/w4/automation/audit_publication.py
          python3 deploy/w4/automation/test_core_sync.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Install pinned toolchain
        run: |
          npm install -g bun@1.4.4
          test "$(bun --version)" = 1.4.4
          bun install --frozen-lockfile --ignore-scripts
      - name: Build API dependency workspaces
        run: bunx --no-install turbo run build --filter='api^...' --concurrency=2
      - name: Type-check Community web
        timeout-minutes: 10
        run: bun run --cwd packages/web typecheck
      - name: Build Community web
        timeout-minutes: 10
        run: W4_WEB_INVENTORY="$RUNNER_TEMP/w4-web-modules.json" bun run --cwd packages/web build
      - name: Build Community API and verify artifact inventories
        timeout-minutes: 5
        run: |
          (
            cd packages/server/api
            bunx --no-install esbuild src/bootstrap.ts --bundle --platform=node --format=cjs --packages=external --tsconfig=tsconfig.app.json --target=node24 --outfile="$RUNNER_TEMP/w4-api.cjs" --metafile="$RUNNER_TEMP/w4-api.json"
          )
          python3 deploy/w4/automation/check_build.py "$RUNNER_TEMP/w4-api.json" "$RUNNER_TEMP/w4-web-modules.json"
      - name: W4 role and tenant isolation policy
        run: |
          bunx --no-install esbuild packages/server/api/src/app/w4/access-policy.ts --platform=node --format=cjs --outfile=packages/server/api/dist/src/app/w4/access-policy.js
          node --test deploy/w4/access-policy.test.cjs
